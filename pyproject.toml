[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorebuddy"
version = "0.2.0.dev0"
description = "LoreBuddy M2 rule cluster pilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
lorebuddy = "lorebuddy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
